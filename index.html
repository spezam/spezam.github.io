<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matteo Ridolfi</title>

    <style>
@font-face {
  font-family: 'GeistPixelLine';
  src: url('GeistPixel-Line.ttf') format('truetype');
  font-display: swap;
}

* {
  margin: 0;
  box-sizing: border-box;
}

body {
  font: 15px 'GeistPixelLine', monospace;
  background: #111;
  color: #ccc;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.08) 2px,
    rgba(0, 0, 0, 0.08) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.logo {
  padding: 20px 0 50px 50px;
  text-align: left;
}

.home {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: -1;
}

.main {
  flex: none;
  text-align: center;
}

h1 {
  font-size: 16px;
  font-weight: normal;
}

.links {
  margin-top: 12px;
}

a {
  color: #8487af;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  text-decoration: none;
}

a:hover {
  color: #fff;
  background: #8487af;
}

    </style>
  </head>

  <body>
    <div class="main">
      <div class="logo">
	:wq
      </div>
    </div>

    <div class="home">
      <div class="main">
	<h1>Matteo Ridolfi</h1>
	<div class="links">
	  <a target="_blank" href="mailto:spezam+gh@spezam.com">Email</a>
	  |
	  <a target="_blank" href="https://github.com/spezam">GitHub</a>
	</div>
      </div>
    </div>
  </body>
</html>
